name: Android Caller ID APK

on:
  workflow_dispatch:
  push:
    branches: [feature/android-caller-id]
    paths:
      - 'android-caller-id/**'
      - '.github/workflows/android-caller-id.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-caller-id
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NashDom-Caller-ID-test
          path: android-caller-id/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
