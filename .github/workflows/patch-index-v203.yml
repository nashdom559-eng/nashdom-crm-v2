name: Patch index v2.0.3

on:
  push:
    paths:
      - '.github/workflows/patch-index-v203.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('./manifest.json?v=2.0.2', './manifest.json?v=2.0.3')
          s = s.replace('./style.css?v=2.0.2', './style.css?v=2.0.3')
          s = s.replace('НашДом CRM v2.0.2', 'НашДом CRM v2.0.3')
          s = s.replace('./app.js?v=2.0.2', './app.js?v=2.0.3')
          s = s.replace('./firebase-push.js?v=2.0.2', './firebase-push.js?v=2.0.3')

          old = '<button id="pushButton" class="push-btn" type="button">🔔 Включить уведомления</button>'
          new = '''<button id="pushButton" class="push-btn" type="button" hidden>🔔 Включить уведомления</button>
          <script>
            (function() {
              const button = document.getElementById('pushButton');
              const icon = document.getElementById('pushStatusIcon');

              const enabled =
                localStorage.getItem('nashdom_push_enabled') === '1' &&
                'Notification' in window &&
                Notification.permission === 'granted';

              if (icon) {
                icon.textContent = enabled ? '🔔' : '🔕';
                icon.title = enabled ? 'Уведомления включены' : 'Уведомления выключены';
                icon.classList.toggle('enabled', enabled);
              }

              if (button) {
                button.hidden = enabled;
                button.style.display = enabled ? 'none' : '';
              }
            })();
          </script>'''

          if old not in s:
            raise SystemExit('pushButton marker not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix notification startup UI and bump to v2.0.3 [skip ci]"
          git push
