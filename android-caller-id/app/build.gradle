plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.nashdom.callerid'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.nashdom.callerid'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1-test'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
